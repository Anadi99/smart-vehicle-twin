services:
  mosquitto:
    image: eclipse-mosquitto:2.0
    ports:
      - "1883:1883"
    volumes:
      - ../../mosquitto/config:/mosquitto/config:ro

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      INGESTION_MODE: mqtt
      MQTT_HOST: mosquitto
      MQTT_PORT: 1883
      MQTT_TOPIC: "uvtwin/telemetry/#"
      MODELS_DIR: /models
      CORS_ORIGINS: "http://localhost:5173"
    volumes:
      - ../../models:/models:ro
    depends_on:
      - mosquitto
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  frontend:
    build: ./frontend
    ports:
      - "5173:80"
    depends_on:
      backend:
        condition: service_healthy
