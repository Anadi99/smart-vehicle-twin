[build]
  base    = "frontend"
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# SPA fallback — all routes serve index.html
[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200

# Proxy /api/* → backend (set VITE_API_BASE in Netlify env vars instead,
# or use these redirects if your backend supports CORS from netlify domain)
# Uncomment and set YOUR_BACKEND_URL after deploying the backend:
#
# [[redirects]]
#   from   = "/api/*"
#   to     = "https://YOUR_BACKEND_URL/api/:splat"
#   status = 200
#   force  = true
#
# [[redirects]]
#   from   = "/ws/*"
#   to     = "https://YOUR_BACKEND_URL/ws/:splat"
#   status = 200
#   force  = true
