services:
  backend:
    build:
      context: ./backend
      target: base
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - ../../models:/models:ro
    environment:
      INGESTION_MODE: sim
      MODELS_DIR: /models
      CORS_ORIGINS: "http://localhost:5173"
      JWT_SECRET: dev-secret-not-for-production

  frontend:
    image: node:20-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host"
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      VITE_API_BASE: ""
    depends_on:
      - backend
